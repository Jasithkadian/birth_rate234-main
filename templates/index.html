<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Birth Weight Prediction Form</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <div class="card">
    <h1>Birth Weight Prediction</h1>
    <p class="subtitle">Enter maternal data to estimate neonatal birth weight using a linear regression model.</p>
    <form>
      <div class="form-grid">
        <div class="form-group">
          <label>Gestation</label>
          <input name="gestation" type="number" placeholder="e.g. 280" min="140" max="315" step="1" required>
        </div>
        <div class="form-group">
          <label>Parity</label>
          <input name="parity" type="number" placeholder="e.g. 0" min="0" max="15" step="1" required>
        </div>
        <div class="form-group">
          <label>Age</label>
          <input name="age" type="number" placeholder="e.g. 27" min="15" max="55" step="1" required>
        </div>
        <div class="form-group">
          <label>Height</label>
          <input name="height" type="number" placeholder="e.g. 64" min="48" max="76" step="0.5" required>
        </div>
        <div class="form-group full-width">
          <label>Weight (Pre-pregnancy)</label>
          <input name="weight" type="number" placeholder="e.g. 130" min="80" max="300" step="1" required>
        </div>
        <div class="form-group full-width">
          <label>Smoking Status</label>
          <select name="smoke" required>
            <option value="" disabled selected>Select status…</option>
            <option value="0">Non-smoker</option>
            <option value="1">Smoker</option>
          </select>
        </div>
      </div>

      <button type="submit" class="btn-predict">Predict Birth Weight</button>
    </form>

    <div id="result-card">
      <p class="result-label">Estimated Birth Weight</p>
      <p class="result-value" id="result-value">—</p>
      <p class="result-unit">ounces (oz)</p>
    </div>
    <div id="error-msg"></div>
  </div>
  <script src="/static/script.js"></script>
</body>
</html>
