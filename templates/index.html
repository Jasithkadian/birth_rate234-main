<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Birth Weight Predictor</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;1,9..40,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <div class="card">
    <div class="card-header">
      <h1>Birth Weight Predictor</h1>
      <p class="subtitle">Enter maternal data to estimate neonatal birth weight using a trained linear regression model.</p>
    </div>

    <div class="divider"></div>

    <form id="predict-form">
      <div class="form-grid">
        <div class="form-group">
          <label for="gestation">Gestation <span class="unit">days</span></label>
          <input type="number" id="gestation" name="gestation" placeholder="e.g. 280" min="140" max="315" step="1" required>
        </div>
        <div class="form-group">
          <label for="parity">Parity <span class="unit">prior births</span></label>
          <input type="number" id="parity" name="parity" placeholder="e.g. 0" min="0" max="15" step="1" required>
        </div>
        <div class="form-group">
          <label for="age">Age <span class="unit">years</span></label>
          <input type="number" id="age" name="age" placeholder="e.g. 27" min="15" max="55" step="1" required>
        </div>
        <div class="form-group">
          <label for="height">Height <span class="unit">inches</span></label>
          <input type="number" id="height" name="height" placeholder="e.g. 64" min="48" max="76" step="0.5" required>
        </div>
        <div class="form-group full-width">
          <label for="weight">Weight <span class="unit">lbs (pre-pregnancy)</span></label>
          <input type="number" id="weight" name="weight" placeholder="e.g. 130" min="80" max="300" step="1" required>
        </div>
        <div class="form-group full-width">
          <label for="smoke">Smoking Status</label>
          <select id="smoke" name="smoke" required>
            <option value="" disabled selected>Select status…</option>
            <option value="0">Non-smoker</option>
            <option value="1">Smoker</option>
          </select>
        </div>
      </div>

      <button type="submit" class="btn-predict">Predict Birth Weight</button>
    </form>

    <div id="result-card">
      <p class="result-label">Estimated Birth Weight</p>
      <p class="result-value" id="result">—</p>
      <p class="result-unit">ounces (oz)</p>
    </div>
    <div id="error-msg"></div>
  </div>
  <script src="/static/script.js"></script>
</body>
</html>
